[project]
name = "product-category-classifier"
version = "1.0.0"
description = "Catégorisation automatique d'articles à partir de la description et de la photographie"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Les carnets ont leurs usages propres : une amorce de chemin avant les imports,
# des imports au fil du récit, et des appels groupés en fin de cellule. Les
# interdire rendrait les carnets moins lisibles pour un gain nul.
"*.ipynb" = ["E402", "E702", "F401", "I001", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "encoders: nécessite torch et transformers, exclu de l'intégration continue",
    "images: nécessite les photographies dans data/Flipkart/Images",
]
