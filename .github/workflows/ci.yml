name: ci

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  qualite:
    name: lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le socle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        run: pytest

  reproductibilite:
    name: la chaîne se rejoue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le socle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Les encodeurs pré-entraînés et les photographies ne sont pas dans
      # l'intégration continue : 1,4 Go de poids et 351 Mo d'images. On vérifie
      # que la partie texte se rejoue de bout en bout depuis un clone propre.
      - name: Profilage du jeu
        run: python scripts/profile_data.py

      - name: Benchmark texte
        run: python benchmark.py

      - name: Vérifier les sorties
        run: |
          test -f reports/benchmark.csv
          python - <<'PY'
          import pandas as pd
          t = pd.read_csv("reports/benchmark.csv")
          assert len(t) >= 2, t
          assert t["F1 macro"].max() >= 0.90, t
          print(t.to_string(index=False))
          PY
